name: arkscan
description: "Arktech Test Scanner"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.5.2
  fluttertoast: ^8.2.12
  path_provider: ^2.1.5
  open_file: ^3.5.10
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  mime: ^2.0.0
  wakelock_plus: ^1.3.2
  flutter_pdfview: ^1.4.0+1
  unique_identifier: ^0.4.0
  mobile_scanner: ^7.0.0
  vibration: ^3.1.3
  camera: ^0.11.0+2
  opencv_dart: ^2.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
flutter:
  uses-material-design: true
  assets:
    - assets/images/

